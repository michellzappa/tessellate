name: Tessellate
options:
  bundleIdPrefix: app.tessellate
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Sign with a real identity, not ad-hoc: TCC keys the Accessibility grant to
    # the code signature, so an ad-hoc build loses the permission on every
    # rebuild. Manual signing avoids needing a "Mac Development" cert.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 992N457T8D
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  Tessellate:
    type: application
    platform: macOS
    sources:
      - path: Tessellate
        excludes:
          - "Resources/Info.plist"
          - "Resources/Tessellate.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tessellate.Tessellate
        PRODUCT_NAME: Tessellate
        CODE_SIGN_ENTITLEMENTS: Tessellate/Resources/Tessellate.entitlements
        INFOPLIST_FILE: Tessellate/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  Tessellate:
    build:
      targets:
        Tessellate: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
